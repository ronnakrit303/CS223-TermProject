#   - การเปลี่ยน YAML เพียงอย่างเดียวไม่รับประกันว่าคอนเทนเนอร์เก่าจะหยุด
#   - รายละเอียดอยู่ใน docs/06-troubleshooting.md


# =============================================================================
# 13. Safe Validation Checklist (Comments Only)
